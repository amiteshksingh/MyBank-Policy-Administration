spring:
  application:
    name: MyBank Policy Administration
  datasource:
    url: jdbc:h2:file:./data/mybank-policy-db
    username: mybank
    password: mybank
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
server:
  port: 9090
mybank:
  opa:
    url: ${OPA_URL:http://localhost:8181}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
